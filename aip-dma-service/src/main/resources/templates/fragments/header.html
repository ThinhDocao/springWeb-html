<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="site-header">
    <div class="container">
        <div class="header-top">
            <span>🚚 Miễn phí giao hàng đơn từ 5.000.000₫</span>
            <span th:text="${siteSettings['workingHours'] != null and !siteSettings['workingHours'].isEmpty() ? siteSettings['workingHours'] : '🕐 Giờ làm việc: 8:00 - 18:00 | Thứ 2 - Chủ Nhật'}">🕐 Giờ làm việc: 8:00 - 18:00 | Thứ 2 - Chủ Nhật</span>
        </div>
        <div class="header-main">
            <a href="/" class="logo">
                <img th:if="${siteSettings['logoUrl'] != null and !siteSettings['logoUrl'].isEmpty()}" th:src="@{${siteSettings['logoUrl']}}" th:alt="${siteSettings['siteName']}" style="height:54px;width:auto;">
                <div th:unless="${siteSettings['logoUrl'] != null and !siteSettings['logoUrl'].isEmpty()}" class="logo-text">
                    <span th:remove="tag" th:text="${siteSettings['siteName'] != null and !siteSettings['siteName'].isEmpty() ? siteSettings['siteName'] : 'ĐỒ ĐỒNG MỸ NGHỆ'}">ĐỒ ĐỒNG MỸ NGHỆ</span>
                    <span>Tinh hoa đồng Việt</span>
                </div>
            </a>
            <ul class="main-nav" id="mainNav">

                <li><a th:href="@{/}">Trang chủ</a></li>
                <li><a th:href="@{/gioi-thieu}">Giới thiệu</a></li>
                <li class="has-dropdown">
                    <a th:href="@{/san-pham}">Sản phẩm</a>
                    <span class="mobile-dropdown-toggle">▾</span>
                    <div class="mega-menu">
                        <div class="mega-menu-grid">
                            <div class="mega-menu-column" th:each="rootCat : ${categories}">
                                <a class="mega-menu-title" th:href="@{'/' + ${rootCat.slug}}" th:text="${rootCat.name}">Tượng Đồng</a>
                                <ul th:if="${rootCat.subCategories != null and !rootCat.subCategories.isEmpty()}">
                                    <li th:each="subCat : ${rootCat.subCategories}">
                                        <a th:href="@{'/' + ${subCat.slug}}" th:text="${subCat.name}">Tượng Bác Hồ</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </li>
                <li><a th:href="@{/tin-tuc}">Tin tức</a></li>
                <li><a th:href="@{/lien-he}">Liên hệ</a></li>
            </ul>
            <div class="header-icons">
                <span class="header-icon search-trigger" id="searchTriggerDesktop" title="Tìm kiếm">🔍</span>
                <a href="javascript:void(0)" class="header-icon cart-trigger" id="cartTrigger" title="Giỏ hàng">
                    🛒
                    <span class="cart-badge" id="cartBadge">0</span>
                </a>
            </div>
            <div class="mobile-toggle" id="mobileToggle">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>
</header>
</html>
