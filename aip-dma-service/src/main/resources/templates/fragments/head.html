<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Đồ Đồng Mỹ Nghệ</title>
    <meta name="description" th:content="${description}">
    <link th:if="${siteSettings != null and siteSettings['faviconUrl'] != null and !siteSettings['faviconUrl'].isEmpty()}" rel="icon" th:href="@{${siteSettings['faviconUrl']}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        /* CSS overrides for related products and sidebar posts to bypass browser caching */
        .sidebar-post {
            display: flex !important;
            gap: 12px !important;
            margin-bottom: 16px !important;
            padding-bottom: 16px !important;
            border-bottom: 1px solid var(--gray-100) !important;
            align-items: flex-start !important;
        }
        .sidebar-post > a,
        .sidebar-post > img {
            flex-shrink: 0 !important;
            display: block !important;
            width: 70px !important;
            height: 70px !important;
        }
        .sidebar-post img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: var(--radius-sm) !important;
            display: block !important;
        }
        .sidebar-post > div {
            flex: 1 !important;
            min-width: 0 !important;
        }
        .sidebar-post h5 {
            font-size: 0.9rem !important;
            margin-bottom: 4px !important;
            line-height: 1.3 !important;
            display: -webkit-box !important;
            -webkit-line-clamp: 2 !important;
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }
        .sidebar-post h5 a {
            color: var(--dark) !important;
            text-decoration: none !important;
        }
        .sidebar-post h5 a:hover {
            color: var(--bronze) !important;
        }
    </style>
    <th:block th:if="${siteSettings != null}" th:utext="${siteSettings['googleAnalyticsScript']}"></th:block>
</head>
</html>
