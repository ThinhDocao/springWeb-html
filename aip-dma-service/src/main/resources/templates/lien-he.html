<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle}">Liên hệ</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div th:replace="fragments/header :: header"></div>
  <section class="page-banner"><div class="container"><h1>Liên hệ</h1><p class="breadcrumb"><a href="/">Trang chủ</a> / Liên hệ</p></div></section>
  <section class="page-content">
    <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
      <div class="contact-form">
        <h3>Gửi tin nhắn cho chúng tôi</h3>
        <form>
          <div class="form-group"><label>Họ và tên *</label><input type="text" placeholder="Nhập họ và tên" required/></div>
          <div class="form-group"><label>Số điện thoại *</label><input type="tel" placeholder="Nhập số điện thoại" required/></div>
          <div class="form-group"><label>Email</label><input type="email" placeholder="Nhập email"/></div>
          <div class="form-group"><label>Nội dung *</label><textarea placeholder="Nhập nội dung tin nhắn" required></textarea></div>
          <button type="submit" class="btn-submit">Gửi tin nhắn</button>
        </form>
      </div>
      <div>
        <h3>Thông tin liên hệ</h3>
        <div class="contact-info-grid">
          <div class="info-card"><div class="icon">&#128205;</div><h4>Địa chỉ</h4><p>Nguyệt Thượng – Tân Minh – Ninh Bình</p></div>
          <div class="info-card"><div class="icon">&#9742;</div><h4>Hotline</h4><p>0978.828.626</p></div>
          <div class="info-card"><div class="icon">&#9993;</div><h4>Email</h4><p>ducdongthanhdat@gmail.com</p></div>
          <div class="info-card"><div class="icon">&#128337;</div><h4>Giờ làm việc</h4><p>Thứ 2 - Chủ nhật: 8h - 18h</p></div>
        </div>
      </div>
    </div>
  </section>
  <div th:replace="fragments/footer :: footer"></div>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
