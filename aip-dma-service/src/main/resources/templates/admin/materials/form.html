<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/fragments/head :: head(${pageTitle})"></head>
<body class="admin-body">
<div class="admin-shell">
    <div th:replace="admin/fragments/sidebar :: sidebar(${activePage})"></div>
    <main class="admin-main">
        <div th:replace="admin/fragments/topbar :: topbar(${pageTitle})"></div>
        <section class="admin-content">
            <form class="admin-form-grid narrow" method="post"
                  th:action="${material.id == null} ? @{/admin/materials} : @{/admin/materials/{id}(id=${material.id})}">
                <div class="admin-panel form-panel">
                    <label>
                        <span>Tên chất liệu *</span>
                        <input type="text" name="name" th:value="${material.name}" required>
                    </label>
                    <label>
                        <span>Mô tả</span>
                        <textarea name="description" rows="4" th:text="${material.description}"></textarea>
                    </label>
                    <div class="toggle-grid">
                        <label><input type="checkbox" name="isActive" value="true" th:checked="${material.active}"> Hiển thị</label>
                    </div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/admin/materials}" class="admin-btn ghost">Hủy</a>
                    <button type="submit" class="admin-btn primary">Lưu chất liệu</button>
                </div>
            </form>
        </section>
    </main>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
